[package]
name = "dsh-eyes"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = "=0.23.1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
toml = "1"
getrandom = "0.2"
chromiumoxide = "0.9.1"

[features]
# Active un BrowserPool de test (spawn d'un process bidon) sans tirer
# chromiumoxide, pour valider la logique de cycle de vie en CI headless.
test-util = []
