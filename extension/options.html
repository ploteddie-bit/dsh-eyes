<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Eyes — Options</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --bord:#30363d; --text:#e6edf3; --muted:#8b949e; --ok:#3fb950; --warn:#d29922; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
  main { max-width:640px; margin:40px auto; padding:0 24px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--bord); border-radius:10px; padding:20px; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  input { width:100%; background:#0a0d12; border:1px solid var(--bord); border-radius:8px; color:var(--text); padding:10px 12px; font:14px ui-monospace,monospace; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  button { border:1px solid var(--bord); background:#212a33; color:var(--text); border-radius:8px; padding:9px 16px; cursor:pointer; font-size:14px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#0d1117; font-weight:600; }
  button:hover { filter:brightness(1.1); }
  #status { margin-top:14px; font-size:14px; color:var(--muted); }
  code { background:#212a33; padding:1px 5px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>
<main>
  <h1>DSH Eyes</h1>
  <p class="sub">Token d'authentification du démon local.</p>
  <div class="card">
    <p>Le token est stocké dans <code>chrome.storage.local</code> et n'est envoyé qu'à <code>127.0.0.1:8445</code>. Il se trouve dans <code>~/.dsh-eyes/token</code> sur le poste.</p>
    <label for="token">Token</label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="64 caractères hexadécimaux">
    <div class="row">
      <button class="primary" id="save">Enregistrer</button>
      <button id="show">Afficher / masquer</button>
    </div>
    <p id="status">—</p>
  </div>
</main>
<script src="options.js"></script>
</body>
</html>
